<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="趣购 FunBuy 购物车——挑选心仪好物，一键结算。年轻、潮流、有趣好物的电商平台。">
    <title>购物车 · 趣购 FunBuy</title>
    <style>
        /* ==================== 全局基础样式（与首页保持一致） ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 品牌主色：活力橙 / 潮流蓝 */
            --brand: #FF6B35;
            --brand-deep: #F04E15;
            --brand-soft: #FFF1E8;
            --blue: #2F6BFF;
            --blue-soft: #EAF0FF;
            --amber: #FFA52F;
            --amber-soft: #FFF4E3;
            --violet: #7C5CFF;
            --violet-soft: #F0EDFF;
            /* 中性色 */
            --ink: #23293B;
            --gray: #7B8499;
            --line: #ECEEF3;
            --bg-soft: #F6F7FB;
            /* 价格 / 删除强调色（红色） */
            --price: #FF3B30;
            /* 圆角与阴影 */
            --radius: 12px;
            --radius-lg: 16px;
            --shadow-card: 0 4px 14px rgba(35, 41, 59, .06);
            --shadow-hover: 0 18px 36px rgba(35, 41, 59, .13);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: var(--ink);
            background: var(--bg-soft);
            /* 底部结算栏悬浮，预留空间避免内容被遮挡 */
            padding-bottom: 130px;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            display: block;
            max-width: 100%;
        }

        button {
            font-family: inherit;
            border: none;
            background: none;
            cursor: pointer;
        }

        ul {
            list-style: none;
        }

        /* 键盘焦点可见性（无障碍） */
        :focus-visible {
            outline: 3px solid rgba(47, 107, 255, .55);
            outline-offset: 2px;
            border-radius: 6px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ==================== 1. 顶部导航栏（复用首页样式） ==================== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            gap: 24px;
            height: 72px;
        }

        .logo {
            flex-shrink: 0;
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 44px;
            width: auto;
        }

        .search {
            flex: 1;
            max-width: 560px;
            margin: 0 auto;
            position: relative;
        }

        .search input {
            width: 100%;
            height: 46px;
            padding: 0 96px 0 20px;
            border: 2px solid var(--line);
            border-radius: 999px;
            background: var(--bg-soft);
            font-size: 14px;
            color: var(--ink);
            outline: none;
            transition: border-color .25s, box-shadow .25s, background .25s;
        }

        .search input::placeholder {
            color: #AAB2C3;
        }

        .search input:focus {
            border-color: var(--brand);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(255, 107, 53, .12);
        }

        .search-btn {
            position: absolute;
            right: 5px;
            top: 5px;
            bottom: 5px;
            width: 84px;
            border-radius: 999px;
            background: var(--brand);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 14px;
            font-weight: 600;
            transition: background .25s, transform .25s;
        }

        .search-btn:hover {
            background: var(--brand-deep);
        }

        .search-btn:active {
            transform: scale(.97);
        }

        .actions {
            flex-shrink: 0;
            display: flex;
            gap: 6px;
        }

        .action-btn {
            position: relative;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 9px 16px;
            border-radius: var(--radius);
            color: var(--ink);
            font-size: 14px;
            font-weight: 600;
            transition: background .25s, color .25s;
        }

        .action-btn:hover {
            background: var(--brand-soft);
            color: var(--brand);
        }

        /* 当前页（购物车）高亮态 */
        .action-btn.active {
            background: var(--brand-soft);
            color: var(--brand);
        }

        .action-btn .badge {
            position: absolute;
            top: 2px;
            right: 4px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            background: var(--price);
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 700;
            line-height: 18px;
            text-align: center;
        }

        /* ==================== 2. 购物车页面主体 ==================== */
        .cart-page {
            padding: 36px 0 24px;
        }

        /* 页面标题行 */
        .cart-head-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .cart-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .cart-title::before {
            content: "";
            width: 6px;
            height: 26px;
            border-radius: 3px;
            background: linear-gradient(180deg, var(--brand), #FFB38A);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--gray);
            font-size: 13px;
            font-weight: 600;
            transition: color .25s;
        }

        .back-link:hover {
            color: var(--brand);
        }

        .back-link svg {
            width: 15px;
            height: 15px;
        }

        /* 购物车卡片容器 */
        .cart-panel {
            background: #FFFFFF;
            border-radius: var(--radius-lg);
            border: 1px solid var(--line);
            overflow: hidden;
        }

        /* 顶部工具条：全选 + 商品总数 */
        .cart-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            border-bottom: 1px solid var(--line);
        }

        .select-all {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .toolbar-sum {
            font-size: 13px;
            color: var(--gray);
        }

        .toolbar-sum b {
            color: var(--ink);
        }

        /* 列表表头（仅桌面端显示） */
        .cart-head {
            display: grid;
            grid-template-columns: 40px 88px 1fr 110px 132px 110px 36px;
            align-items: center;
            padding: 12px 24px;
            border-bottom: 1px solid var(--line);
            background: var(--bg-soft);
            color: var(--gray);
            font-size: 12.5px;
        }

        /* ==================== 3. 商品列表项 ==================== */
        .cart-item {
            display: grid;
            grid-template-columns: 40px 88px 1fr 110px 132px 110px 36px;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--line);
            transition: background .25s;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item:hover {
            background: #FFFDFB;
        }

        /* 自定义复选框 */
        .chk {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #D5DAE5;
            border-radius: 6px;
            background: #FFFFFF;
            cursor: pointer;
            position: relative;
            transition: background .2s, border-color .2s;
        }

        .chk:hover {
            border-color: var(--brand);
        }

        .chk:checked {
            background: var(--brand);
            border-color: var(--brand);
        }

        .chk:checked::after {
            content: "";
            position: absolute;
            left: 5px;
            top: 1px;
            width: 5px;
            height: 10px;
            border: solid #FFFFFF;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* 半选状态（部分商品被勾选） */
        .chk:indeterminate {
            background: var(--brand);
            border-color: var(--brand);
        }

        .chk:indeterminate::after {
            content: "";
            position: absolute;
            left: 3px;
            top: 8px;
            width: 10px;
            height: 2px;
            border-radius: 2px;
            background: #FFFFFF;
        }

        /*         /* 商品缩略图：本地商品图片（images/product-N.jpg） */
        .thumb {
            width: 88px;
            height: 88px;
            border-radius: var(--radius);
            object-fit: cover;
            background: #FFFFFF;
        }

        /* 商品名称与规格 */
        .info .name {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
        }

        .info .spec {
            margin-top: 4px;
            font-size: 12px;
            color: var(--gray);
        }

        .unit-price,
        .subtotal {
            font-size: 15px;
            font-weight: 700;
        }

        /* 小计金额：红色高亮 */
        .subtotal {
            color: var(--price);
        }

        /* 数量加减控制器 */
        .qty {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #FFFFFF;
            overflow: hidden;
        }

        .qty button {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            background: var(--bg-soft);
            transition: background .2s, color .2s;
        }

        /* 数量加减按钮悬停：背景色变化 */
        .qty button:hover {
            background: var(--brand);
            color: #FFFFFF;
        }

        .qty button:active {
            transform: scale(.92);
        }

        .qty svg {
            width: 13px;
            height: 13px;
            pointer-events: none;
        }

        .qty .num {
            width: 44px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
        }

        /* 删除按钮：悬停变红 */
        .del {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #B4BBCB;
            transition: color .2s, background .2s, transform .2s;
        }

        .del:hover {
            color: var(--price);
            background: #FFF0EE;
        }

        .del:active {
            transform: scale(.9);
        }

        .del svg {
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        /* 购物车为空时的提示 */
        .cart-empty {
            display: none;
            padding: 72px 24px;
            text-align: center;
        }

        .cart-empty svg {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            color: #C6CBD9;
        }

        .cart-empty p {
            color: var(--gray);
            font-size: 15px;
            margin-bottom: 20px;
        }

        .btn-ghost-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            padding: 0 32px;
            border-radius: 999px;
            background: #FFFFFF;
            color: var(--brand);
            border: 2px solid #FFD9C8;
            font-size: 14px;
            font-weight: 700;
            transition: border-color .25s, background .25s, transform .25s;
        }

        .btn-ghost-link:hover {
            border-color: var(--brand);
            background: var(--brand-soft);
            transform: translateY(-2px);
        }

        /* ==================== 4. 底部结算栏（固定悬浮） ==================== */
        .settle {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 200;
            background: rgba(255, 255, 255, .96);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--line);
            box-shadow: 0 -10px 30px rgba(35, 41, 59, .08);
        }

        .settle-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .settle-left {
            display: flex;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 14px;
            color: var(--ink);
        }

        .settle-left b {
            color: var(--ink);
        }

        /* 合计金额：红色高亮 */
        .settle-total {
            font-size: 14px;
            color: var(--ink);
        }

        .settle-total .total-num {
            color: var(--price);
            font-size: 26px;
            font-weight: 800;
            margin-left: 4px;
        }

        .ship-note {
            font-size: 12px;
            color: var(--gray);
        }

        /* “去结算”大按钮 */
        .settle-btn {
            flex-shrink: 0;
            height: 52px;
            min-width: 190px;
            padding: 0 44px;
            border-radius: 999px;
            background: linear-gradient(135deg, #FF8A50, var(--brand));
            color: #FFFFFF;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 2px;
            box-shadow: 0 10px 24px rgba(255, 107, 53, .38);
            transition: background .25s, transform .25s, box-shadow .25s;
        }

        .settle-btn:hover {
            background: linear-gradient(135deg, var(--brand), var(--brand-deep));
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(255, 107, 53, .48);
        }

        .settle-btn:active {
            transform: translateY(0);
        }

        /* （响应式媒体查询已移除：本页面仅针对 PC 桌面端设计） */
        /* 手机端：隐藏次要信息，结算栏保持固定 */
            </style>
</head>
<body>

    <!-- ==================== 1. 顶部导航栏（与首页一致） ==================== -->
    <header class="topbar" aria-label="顶部导航">
        <div class="container topbar-inner">
            <!-- 左侧：趣购 Logo（png 图片，本地相对路径 images/logo.png） -->
            <a class="logo" href="趣购FunBuy首页.html" aria-label="趣购 FunBuy 首页">
                <img src="images/logo.png" alt="趣购 FunBuy Logo">
            </a>

            <!-- 中间：搜索框 -->
            <div class="search" role="search">
                <input type="search" placeholder="搜索你感兴趣的好物，如：耳机、盲盒、卫衣…" aria-label="搜索商品">
                <button class="search-btn" type="button" aria-label="搜索">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                    搜索
                </button>
            </div>

            <!-- 右侧：购物车 / 登录 -->
            <div class="actions">
                <a class="action-btn active" href="cart.html" aria-label="购物车">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/><path d="M3 4h2l2.4 12h11L21 7H6"/></svg>
                    <span>购物车</span>
                    <span class="badge">3</span>
                </a>
                <a class="action-btn" href="#" aria-label="登录">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
                    <span>登录</span>
                </a>
            </div>
        </div>
    </header>

    <!-- ==================== 2. 购物车页面主体 ==================== -->
    <main class="cart-page" aria-label="购物车列表">
        <div class="container">

            <!-- 页面标题行 -->
            <div class="cart-head-row">
                <h1 class="cart-title">我的购物车</h1>
                <a class="back-link" href="趣购FunBuy首页.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
                    继续购物
                </a>
            </div>

            <div class="cart-panel">

                <!-- 顶部工具条：全选 + 商品总数 -->
                <div class="cart-bar">
                    <label class="select-all">
                        <input class="chk" type="checkbox" id="selectAll" checked aria-label="全选">
                        全选
                    </label>
                    <span class="toolbar-sum">共 <b id="totalCount">3</b> 件商品</span>
                </div>

                <!-- 列表表头（桌面端） -->
                <div class="cart-head" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span>商品信息</span>
                    <span>单价</span>
                    <span>数量</span>
                    <span>小计</span>
                    <span>操作</span>
                </div>

                <!-- ==================== 3. 商品列表项 ==================== -->

                <!-- 商品 1：耳机（单价 129，数量 1） -->
                <div class="cart-item" data-price="129">
                    <input class="chk" type="checkbox" checked aria-label="选择 乐享 Pro 真无线蓝牙耳机">
                    <img class="thumb" src="images/product-1.jpg" alt="乐享 Pro 真无线蓝牙耳机">
                    <div class="info">
                        <p class="name">乐享 Pro 真无线蓝牙耳机</p>
                        <p class="spec">颜色：白色 · 版本：标准版</p>
                    </div>
                    <div class="unit-price">¥129</div>
                    <div class="qty" aria-label="数量">
                        <button class="minus" type="button" aria-label="减少数量">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
                        </button>
                        <span class="num">1</span>
                        <button class="plus" type="button" aria-label="增加数量">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>
                        </button>
                    </div>
                    <div class="subtotal">¥129</div>
                    <button class="del" type="button" aria-label="删除 乐享 Pro 真无线蓝牙耳机">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>
                    </button>
                </div>

                <!-- 商品 2：零食盲盒（单价 59.9，数量 2） -->
                <div class="cart-item" data-price="59.9">
                    <input class="chk" type="checkbox" checked aria-label="选择 快乐星球 零食盲盒大礼包">
                    <img class="thumb" src="images/product-5.jpg" alt="快乐星球 零食盲盒大礼包">
                    <div class="info">
                        <p class="name">快乐星球 零食盲盒大礼包</p>
                        <p class="spec">规格：随机款 · 约 30 包</p>
                    </div>
                    <div class="unit-price">¥59.9</div>
                    <div class="qty" aria-label="数量">
                        <button class="minus" type="button" aria-label="减少数量">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
                        </button>
                        <span class="num">2</span>
                        <button class="plus" type="button" aria-label="增加数量">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>
                        </button>
                    </div>
                    <div class="subtotal">¥119.8</div>
                    <button class="del" type="button" aria-label="删除 快乐星球 零食盲盒大礼包">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>
                    </button>
                </div>

                <!-- 商品 3：帆布鞋（单价 139，数量 1） -->
                <div class="cart-item" data-price="139">
                    <input class="chk" type="checkbox" checked aria-label="选择 小白云 轻量帆布鞋">
                    <img class="thumb" src="images/product-8.jpg" alt="小白云 轻量帆布鞋">
                    <div class="info">
                        <p class="name">小白云 轻量帆布鞋</p>
                        <p class="spec">颜色：米白 · 尺码：38 码</p>
                    </div>
                    <div class="unit-price">¥139</div>
                    <div class="qty" aria-label="数量">
                        <button class="minus" type="button" aria-label="减少数量">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
                        </button>
                        <span class="num">1</span>
                        <button class="plus" type="button" aria-label="增加数量">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>
                        </button>
                    </div>
                    <div class="subtotal">¥139</div>
                    <button class="del" type="button" aria-label="删除 小白云 轻量帆布鞋">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>
                    </button>
                </div>

                <!-- 购物车为空提示（全部删除后显示） -->
                <div class="cart-empty" id="cartEmpty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/><path d="M3 4h2l2.4 12h11L21 7H6"/></svg>
                    <p>购物车空空如也，去首页发现更多好物吧～</p>
                    <a class="btn-ghost-link" href="趣购FunBuy首页.html">去逛逛</a>
                </div>
            </div>
        </div>
    </main>

    <!-- ==================== 4. 底部结算栏（固定悬浮） ==================== -->
    <div class="settle" aria-label="结算栏">
        <div class="settle-inner">
            <div class="settle-left">
                <span>已选 <b id="selCount">4</b> 件</span>
                <span class="settle-total">合计：<span class="total-num" id="totalPrice">¥387.8</span></span>
                <span class="ship-note" id="shipNote">已满 ¥49，免运费</span>
            </div>
            <button class="settle-btn" id="checkoutBtn" type="button">去结算</button>
        </div>
    </div>

    <!-- ==================== 轻量原生 JS：全选 / 数量 / 删除 / 合计联动 ====================
         仅用原生 DOM 操作，无任何依赖；若只需要静态展示，可整体删除本脚本。 -->
    <script>
        (function () {
            'use strict';

            var selectAll = document.getElementById('selectAll');
            var selCount = document.getElementById('selCount');
            var totalPrice = document.getElementById('totalPrice');
            var totalCount = document.getElementById('totalCount');
            var shipNote = document.getElementById('shipNote');
            var cartEmpty = document.getElementById('cartEmpty');
            var FREE_SHIP = 49; // 免运费门槛

            // 金额格式化：整数不带小数，其余最多保留 2 位并去掉末尾 0
            function fmt(n) {
                var v = Math.round(n * 100) / 100;
                return String(v);
            }

            // 当前仍在页面中的商品项
            function liveItems() {
                return Array.prototype.slice.call(document.querySelectorAll('.cart-item'));
            }

            // 重新计算：小计、合计、已选件数、全选状态、空车提示
            function refresh() {
                var items = liveItems();
                var count = 0;      // 已选件数（按数量累加）
                var sum = 0;        // 已选金额
                var checkedNum = 0; // 已勾选的行数

                items.forEach(function (it) {
                    var chk = it.querySelector('.chk');
                    var num = it.querySelector('.num');
                    var sub = it.querySelector('.subtotal');
                    var price = parseFloat(it.getAttribute('data-price')) || 0;
                    var qty = parseInt(num.textContent, 10) || 1;
                    var amount = price * qty;

                    sub.textContent = '¥' + fmt(amount);

                    if (chk.checked) {
                        count += qty;
                        sum += amount;
                        checkedNum += 1;
                    }
                });

                selCount.textContent = count;
                totalPrice.textContent = '¥' + fmt(sum);
                totalCount.textContent = items.length;

                // 全选与半选状态
                selectAll.checked = items.length > 0 && checkedNum === items.length;
                selectAll.indeterminate = checkedNum > 0 && checkedNum < items.length;

                // 免运费提示
                if (items.length === 0 || sum >= FREE_SHIP) {
                    shipNote.textContent = items.length === 0 ? '' : '已满 ¥49，免运费';
                } else {
                    shipNote.textContent = '再买 ¥' + fmt(FREE_SHIP - sum) + ' 即可免运费';
                }

                // 空车提示
                cartEmpty.style.display = items.length === 0 ? 'block' : 'none';
            }

            // 全选 / 取消全选
            selectAll.addEventListener('change', function () {
                liveItems().forEach(function (it) {
                    it.querySelector('.chk').checked = selectAll.checked;
                });
                refresh();
            });

            // 逐项绑定：勾选、数量加减、删除
            function bindItem(it) {
                it.querySelector('.chk').addEventListener('change', refresh);

                var num = it.querySelector('.num');
                var minus = it.querySelector('.minus');
                var plus = it.querySelector('.plus');

                minus.addEventListener('click', function () {
                    var qty = parseInt(num.textContent, 10) || 1;
                    if (qty > 1) {
                        num.textContent = qty - 1;
                        refresh();
                    }
                });

                plus.addEventListener('click', function () {
                    var qty = parseInt(num.textContent, 10) || 1;
                    if (qty < 99) {
                        num.textContent = qty + 1;
                        refresh();
                    }
                });

                it.querySelector('.del').addEventListener('click', function () {
                    it.parentNode.removeChild(it);
                    refresh();
                });
            }

            liveItems().forEach(bindItem);
            refresh();
        })();
    </script>

</body>
